name: Build Orchestrator
description: Builds orchestrator plug-in

inputs:
  artifact-name:
    description: The artifact name to upload generated files as
    required: true
  cache-name:
    description: The cache name to use
    default: ${{ github.job }}
  cache-path:
    description: The cache path
    default: ${{ github.workspace }}/.ccache
  preset-name:
    description: The cmake preset configuration to use
    required: true
  python-arch:
    description: The python architecture
    default: x64
  python-version:
    description: The python version to use
    default: 3.x
  scons-version:
    description: The SCons version to use
    default: 4.10.1

runs:
  using: "composite"
  steps:

    - name: Setup python 3.x
      uses: actions/setup-python@v6
      with:
        # Semantic version range syntax or exact version of a Python version
        python-version: ${{ inputs.python-version }}
        # Optional - x64 or x86 architecture, defaults to x64
        architecture: ${{ inputs.python-arch }}

    - name: Setup SCons
      shell: bash
      run: |
        python -c "import sys; print(sys.version)"
        python -m pip install scons==${{ inputs.scons-version }}
        scons --version

    # We try to match an existing cache to restore from it. Each potential key is checked against
    # all existing caches as a prefix, e.g. 'linux-editor' would match any cache that starts with
    # "linux-editor", such as "linux-editor-abc|main|6588a4a29af1621086feac0117d5d4d37af957fd".
    #
    # We check these prefixes in this order:
    #   1. An exact match for the base branch, reference name, and SHA hash.
    #   2. A partial match for the same cache name and reference name.
    #   3. A partial match for the same cache name and default branch name
    - name: Restore cache
      id: restore-cache
      uses: actions/cache/restore@v5
      with:
        path: ${{ inputs.cache-path }}
        key: ${{ inputs.cache-name }}|${{ github.base_ref || github.ref_name }}|${{ github.sha }}
        restore-keys: |
          ${{ inputs.cache-name }}|${{ github.base_ref || github.ref_name }}|
          ${{ inputs.cache-name }}|${{ github.event.repository.default_branch }}|

    # Installs ccache
    - name: Install ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        key: ${{ inputs.cache-name }}|${{ github.ref_name }}|${{ github.sha }}
        restore: false
        save: false
        append-timestamp: false
        # Explicitly disable job statistics summary
        job-summary: ""

    - name: Set ccache compression level
      shell: bash
      run: |
        ccache --set-config=compression_level=9
        ccache --set-config=max_size=500M

    - name: Build
      shell: sh
      run: |
        cmake --preset ${{ inputs.preset-name }} -S '${{ github.workspace }}'
        cmake --build '${{ github.workspace }}/build/${{ inputs.preset-name }}' --target orchestrator -j 18

    - name: Prune old caches
      if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.restore-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        CACHE_PREFIX: ${{ inputs.cache-name }}|${{ github.ref_name }}|
      run: |
        gh cache list --key "${CACHE_PREFIX}" --json id \
          | jq -r '.[].id' \
          | tr -d '\r' \
          | while IFS= read -r id; do
              [ -z "$id" ] && continue
              gh cache delete --repo "${GH_REPO}" "$id" || true
            done

    - name: Save cache
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      uses: actions/cache/save@v5
      with:
        path: ${{ inputs.cache-path }}
        key: ${{ inputs.cache-name }}|${{ github.ref_name }}|${{ github.sha }}

    # Makes sure that all repository root files that should be included in the distribution
    # are copied into the `project/addons` directory.
    - name: Prepare addon files
      shell: bash
      run: |
        cp '${{ github.workspace }}/AUTHORS.md' '${{ github.workspace }}/project/addons/orchestrator/'
        cp '${{ github.workspace }}/CHANGELOG.md' '${{ github.workspace }}/project/addons/orchestrator/'
        cp '${{ github.workspace }}/README.md' '${{ github.workspace }}/project/addons/orchestrator/'
        cp '${{ github.workspace }}/LICENSE' '${{ github.workspace }}/project/addons/orchestrator/'

    # DO NOT REMOVE -- this file is load-bearing, see GH-854.
    #
    # Godot's asset installer (EditorAssetInstaller::_check_has_toplevel) enables its
    # "Ignore asset root" toggle only when every entry in the archive shares a single
    # common root directory, and the AssetLib download path ticks that toggle by default.
    # With `addons/` as the sole root, Godot strips it and installs Orchestrator into
    # `res://orchestrator/`, where the .gdextension library paths no longer resolve.
    #
    # Placing any second entry at the archive root makes that check bail out, which
    # disables the toggle entirely so the root can never be stripped. The file only has
    # to exist in the archive; the user is free to leave it unchecked when installing.
    #
    # It must live under `project/` so that actions/upload-artifact keeps the archive
    # rooted there. A file outside `project/` would raise the least-common-ancestor to
    # the workspace and nest everything under a `project/` folder instead.
    - name: Prepare asset root marker
      shell: bash
      run: |
        cat > '${{ github.workspace }}/project/ORCHESTRATOR-README.md' <<'EOF'
        # Orchestrator

        Orchestrator was installed into `res://addons/orchestrator/`.

        **This file is safe to delete.** It is not part of the plug-in.

        It is shipped at the root of the distribution archive so that Godot's asset
        installer cannot strip the `addons/` directory. Without it, installing from the
        AssetLib places the plug-in in `res://orchestrator/`, where its GDExtension
        library paths do not resolve and the plug-in silently fails to load.

        See https://github.com/CraterCrash/godot-orchestrator/issues/854
        EOF

    # Creates a demo archive of this specific build, including only the "project" subfolder.
    # The demo is a full project, so its archive root already holds several entries and it
    # is unaffected by GH-854 -- the asset root marker is excluded to keep it clean.
    - name: Upload artifact (Demo)
      uses: actions/upload-artifact@v7
      with:
        name: ${{ github.event.repository.name }}-demo-${{ inputs.artifact-name }}
        retention-days: 1
        path: |
          ${{ github.workspace }}/project/
          !${{ github.workspace }}/project/ORCHESTRATOR-README.md

    # Creates the distribution plugin
    - name: Upload artifact (Plug-in)
      uses: actions/upload-artifact@v7
      with:
        name: ${{ github.event.repository.name }}-plugin-${{ inputs.artifact-name }}
        retention-days: 1
        path: |
          ${{ github.workspace }}/project
          !${{ github.workspace }}/project/addons/orchestrator/*debug*
          !${{ github.workspace }}/project/scenes
          !${{ github.workspace }}/project/icon.svg
          !${{ github.workspace }}/project/project.godot
